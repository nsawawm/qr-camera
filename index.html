<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
NSA QR Scanner
</title>


<style>

body{

font-family:
Arial,
sans-serif;

max-width:
600px;

margin:
25px auto;

padding:
16px;

background:
#f3f5f7;

}


main{

background:
white;

padding:
20px;

border-radius:
12px;

}


button{

display:
block;

width:
100%;

padding:
14px;

margin:
12px 0;

border:
0;

border-radius:
8px;

background:
#1769aa;

color:
white;

font-size:
16px;

cursor:
pointer;

}


button:disabled{

opacity:
0.6;

cursor:
not-allowed;

}


#reader{

width:
100%;

}


#status{

padding:
12px;

background:
#eef2f6;

overflow-wrap:
anywhere;

white-space:
pre-wrap;

}

</style>

</head>



<body>


<main>


<h2>
NSA QR Scanner
</h2>


<p>

Scan an NSA registration or evaluation QR code.

</p>



<div id="reader">
</div>



<button id="start">

START SCANNER

</button>



<button id="stop" hidden>

STOP SCANNER

</button>



<p id="status">

Ready.

</p>


</main>



<script src="https://unpkg.com/html5-qrcode">
</script>



<script>


/* =====================================================
STATE
===================================================== */

let scanner = null;

let scanLocked = false;



/* =====================================================
STATUS
===================================================== */

function setStatus(message){

document
.getElementById("status")
.innerText =
message;

}



/* =====================================================
START SCANNER
===================================================== */

function startScanner(){

if(scanner){

return;

}


scanLocked = false;


scanner =
new Html5Qrcode(

"reader",

{
verbose:true
}

);



scanner.start(

{

facingMode:
"environment"

},


{

fps:10,

qrbox:{
width:300,
height:300
},

aspectRatio:1.0,

rememberLastUsedCamera:true

},


function(decodedText,decodedResult){

console.log(
"========== QR CALLBACK FIRED =========="
);


console.log(
"TEXT:",
decodedText
);


console.log(
"RESULT:",
decodedResult
);



/* =================================================
PREVENT MULTIPLE SCANS
================================================= */

if(scanLocked){

return;

}


scanLocked = true;



setStatus(

"QR FOUND:\n" +
decodedText

);



sendQR(decodedText);

},


function(errorMessage){

/*
Normal scanning errors are ignored.
*/

}

)


.then(function(){

setStatus(

"Camera active. Point at QR code."

);


document
.getElementById("start")
.hidden = true;


document
.getElementById("stop")
.hidden = false;

})


.catch(function(error){

scanner = null;

scanLocked = false;


setStatus(

"Camera error: " +
error

);

});

}



/* =====================================================
STOP SCANNER
===================================================== */

function stopScanner(){

if(!scanner){

return;

}


scanner.stop()

.then(function(){

return scanner.clear();

})

.then(function(){

scanner = null;

scanLocked = false;


document
.getElementById("start")
.hidden = false;


document
.getElementById("stop")
.hidden = true;


setStatus(
"Scanner stopped."
);

})

.catch(function(error){

console.error(
"Scanner stop error:",
error
);

scanner = null;

scanLocked = false;


document
.getElementById("start")
.hidden = false;


document
.getElementById("stop")
.hidden = true;

});

}



/* =====================================================
SEND QR TO PARENT WINDOW
===================================================== */

function sendQR(decodedText){

console.log(
"[QR SCANNED]",
decodedText
);


if(
window.opener &&
!window.opener.closed
){

window.opener.postMessage(

{

type:
"NSA_QR_SCAN",

data:
String(decodedText || "").trim()

},

"*"

);


setStatus(

"QR scanned successfully.\n" +
"Returning to NSA application..."

);


/* =================================================
CLOSE SCANNER WINDOW
================================================= */

setTimeout(function(){

window.close();

},1000);

}

else{

setStatus(

"QR scanned, but the NSA application window was not found."

);

scanLocked = false;

}

}



/* =====================================================
BUTTON EVENTS
===================================================== */

document
.getElementById("start")
.onclick =
startScanner;



document
.getElementById("stop")
.onclick =
stopScanner;


</script>


</body>

</html>
