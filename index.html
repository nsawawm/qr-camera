<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
NSA QR Scanner
</title>


<style>

body{

font-family:Arial;
background:#f3f5f7;
padding:20px;

}


main{

background:white;
padding:20px;
border-radius:12px;

}


button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:8px;
background:#1769aa;
color:white;
font-size:16px;

}


#reader{

width:100%;

}


#status{

margin-top:15px;
padding:10px;
background:#eef2f6;

}


</style>


</head>


<body>


<main>


<h2>
NSA QR Scanner
</h2>


<div id="reader"></div>


<button id="start">
Start Scanner
</button>


<button id="stop" hidden>
Stop Scanner
</button>


<p id="status">
Ready.
</p>


</main>



<script src="https://unpkg.com/html5-qrcode"></script>


<script>


let scanner=null;


let locked=false;



function status(msg){

document.getElementById("status").innerText=msg;

}



function startScanner(){


if(scanner){

return;

}



scanner =
new Html5Qrcode(
"reader"
);



scanner.start(

{
facingMode:"environment"
},

{
fps:10,
qrbox:250

},


(decodedText)=>{


if(locked){

return;

}


locked=true;


status(
"QR detected"
);



sendQR(decodedText);


},


(error)=>{


}



)


.then(()=>{


status(
"Camera active. Scan QR code."
);


document
.getElementById("start")
.hidden=true;


document
.getElementById("stop")
.hidden=false;


})


.catch(error=>{


status(
"Camera error: "+error
);


});


}







function stopScanner(){


if(!scanner){

return;

}


scanner.stop()
.then(()=>{


scanner.clear();

scanner=null;

locked=false;


status(
"Scanner stopped"
);


});


}






function sendQR(text){



if(
window.opener &&
!window.opener.closed
){



window.opener.postMessage(

{

type:"NSA_QR_SCAN",

data:text

},


"*"

);



status(
"QR sent successfully"
);



setTimeout(()=>{

window.close();

},1000);



}

else{


status(
"Original page not found"
);


}



}







document
.getElementById("start")
.onclick=startScanner;




document
.getElementById("stop")
.onclick=stopScanner;



</script>


</body>

</html>
