<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
NSA QR Scanner
</title>


<style>

body{

font-family:Arial,sans-serif;
max-width:600px;
margin:25px auto;
padding:16px;
background:#f3f5f7;

}


main{

background:white;
padding:20px;
border-radius:12px;

}


button{

display:block;
width:100%;
padding:14px;
margin:12px 0;
border:0;
border-radius:8px;
background:#1769aa;
color:white;
font-size:16px;
cursor:pointer;

}


#reader{

width:100%;

}


#status{

padding:12px;
background:#eef2f6;
overflow-wrap:anywhere;

}


</style>


</head>


<body>


<main>


<h2>
NSA QR Scanner
</h2>


<p>
Scan HQ registration or evaluation QR code.
</p>


<div id="reader"></div>


<button id="start">
START SCANNER
</button>


<button id="stop" hidden>
STOP SCANNER
</button>


<p id="status">
Ready.
</p>


</main>



<script src="https://unpkg.com/html5-qrcode"></script>


<script>


let scanner=null;

let scanLocked=false;




function setStatus(message){

document
.getElementById("status")
.innerText=message;

}






function startScanner(){



if(scanner){

return;

}



scanner =
new Html5Qrcode(
"reader",
{
verbose:true
}
);



scanner.start(


{
facingMode:
"environment"
},


{
fps:10,

qrbox:{
width:300,
height:300
},

aspectRatio:1.0,

rememberLastUsedCamera:true
},



function(decodedText, decodedResult){


console.log(
"========== QR CALLBACK FIRED =========="
);


console.log(
"TEXT:",
decodedText
);


console.log(
"RESULT:",
decodedResult
);



setStatus(
"QR FOUND:\n" + decodedText
);



sendQR(decodedText);



},



function(errorMessage){

// Ignore normal scanning errors

}


)


.then(function(){


setStatus(
"Camera active. Point at QR code."
);



document
.getElementById("start")
.hidden=true;



document
.getElementById("stop")
.hidden=false;



})


.catch(function(error){


setStatus(
"Camera error: "+error
);


});


}








function stopScanner(){


if(!scanner){

return;

}



scanner.stop()

.then(function(){


scanner.clear();

scanner=null;

scanLocked=false;



setStatus(
"Scanner stopped"
);



});


}








function sendQR(decodedText){



console.log(
"[QR SCANNED]",
decodedText
);




if(
window.opener &&
!window.opener.closed
){



window.opener.postMessage(

{

type:
"NSA_QR_SCAN",

data:
decodedText

},

"*"

);



setStatus(
"QR sent back successfully"
);





setTimeout(

function(){

window.close();

},

1000

);



}

else{


setStatus(
"Parent window not found."
);



}


}







document

.getElementById("start")

.onclick=startScanner;





document

.getElementById("stop")

.onclick=stopScanner;



</script>


</body>

</html>
